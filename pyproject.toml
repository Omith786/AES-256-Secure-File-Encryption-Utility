[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securecrypt"
version = "1.0.0"
description = "Password-based AES-256-GCM encryption for files and directories, with a CLI and a Tkinter GUI."
readme = "README.md"
license = "MIT"
authors = [{ name = "Omith Chowdhury" }]
requires-python = ">=3.12"
dependencies = ["cryptography>=42", "argon2-cffi>=23.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
securecrypt = "securecrypt.cli:main"

[tool.setuptools]
packages = ["securecrypt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
